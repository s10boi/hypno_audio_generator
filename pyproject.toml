[project]
name = "hypno-audio-generator"
version = "1.1.6"
description = "Generates a single text-to-speech audio file from multiple text files, for use in reinforcement/hypnosis audio."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pyttsx3>=2.99",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.pytest]
addopts = ["--doctest-modules"]
testpaths = ["src", "tests"]
