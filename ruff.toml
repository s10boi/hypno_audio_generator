target-version = "py315"
line-length = 120
preview = true
lint.select = [
    "ALL"
]

lint.ignore = [
    "missing-copyright-notice",
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-magic-method",
    "undocumented-public-nested-class",
    "docstring-missing-returns",
    "print",
    "ambiguous-unicode-character-string",  # e.g. Chinese brackets
    "blanket-type-ignore",
    "missing-trailing-comma",  # Conflicts with the formatter
]

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
ignore-fully-untyped = true
allow-star-arg-any = true

[lint.per-file-ignores]
"__init__.py" = [
    "undocumented-public-package",
    "unused-import",
    "undefined-local-with-import-star",
]
"test_*.py" = [
    "D",  # Docstrings aren't required in tests
    "import-private-name",  # Tests may exercise private helpers
    "assert",
]
